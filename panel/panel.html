<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Panel · Alex Aranda</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;0,600;1,400;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F1EA; --beige:#E9DDCE; --arena:#B89F86; --moca:#7A6250; --cafe:#3B2F28; --sec:#6E5A4A;
  --surface:#FBF8F3; --line:#E3D6C5; --line-2:#D5C4AF;
  --verde:#6B8A5A; --ambar:#C99A3B; --rojo:#B4523C; --gris:#B9ACA0;
  --sel:#EFE5D8; --focus:#7A6250;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1E1814; --beige:#2E251F; --arena:#C9B096; --moca:#D8C3AC; --cafe:#F1E7DB; --sec:#BBA894;
    --surface:#261F1A; --line:#3A2F27; --line-2:#4A3D33; --sel:#2F2620; --focus:#C9B096;
    --verde:#8DAA7A; --ambar:#DDB25A; --rojo:#D2735C; --gris:#7E7166; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1E1814; --beige:#2E251F; --arena:#C9B096; --moca:#D8C3AC; --cafe:#F1E7DB; --sec:#BBA894;
  --surface:#261F1A; --line:#3A2F27; --line-2:#4A3D33; --sel:#2F2620; --focus:#C9B096;
  --verde:#8DAA7A; --ambar:#DDB25A; --rojo:#D2735C; --gris:#7E7166; color-scheme: dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--cafe);font:400 15px/1.5 Jost,system-ui,sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}

/* cabecera */
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 6px}
.marca h1{font:600 26px/1.1 "Cormorant Garamond",Georgia,serif;margin:0;letter-spacing:.2px}
@media (max-width:420px){.marca h1{font-size:22px}}
.marca h1{white-space:nowrap}
.marca small{display:block;color:var(--sec);font-size:12.5px;margin-top:2px}
.acc{display:flex;align-items:center;gap:6px}
.estado-sync{font-size:12.5px;color:var(--sec);text-align:right;transition:opacity .3s}
.marca{min-width:0}
@media (max-width:400px){.marca h1{font-size:20px}.acc{gap:4px}}
.estado-sync.ok{color:var(--verde)} .estado-sync.err{color:var(--rojo)}
.ib{border:1px solid var(--line-2);background:transparent;border-radius:999px;width:34px;height:34px;display:grid;place-items:center;color:var(--moca)}
.ib:hover{background:var(--sel)}
.ib svg{width:16px;height:16px}

/* pestañas */
nav.tabs{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:22px;border-bottom:1px solid var(--line);padding-top:6px;margin-bottom:18px}
nav.tabs button{border:0;background:none;padding:8px 0 10px;font:500 22px/1 "Cormorant Garamond",Georgia,serif;color:var(--sec);border-bottom:2px solid transparent;margin-bottom:-1px}
nav.tabs button[aria-selected="true"]{color:var(--cafe);border-color:var(--arena)}
nav.tabs .n{font:500 12px Jost,sans-serif;color:var(--sec);margin-left:5px;vertical-align:3px}
nav.tabs .nuevo{margin-left:auto;align-self:center;border:1px solid var(--moca);background:var(--moca);color:var(--bg);font:500 13.5px Jost,sans-serif;padding:7px 14px;border-radius:999px;border-bottom:1px solid var(--moca);margin-bottom:4px}
nav.tabs .nuevo:hover{filter:brightness(1.08)}
@media (max-width:440px){nav.tabs{gap:14px;overflow-x:auto;scrollbar-width:none}nav.tabs::-webkit-scrollbar{display:none}nav.tabs button{font-size:19px;flex:none}nav.tabs .nuevo{padding:6px 10px;font-size:12.5px}}

/* resumen */
.resumen{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:22px}
.resumen .cifra{padding:14px 14px 12px;border-left:1px solid var(--line);background:none;border-top:0;border-bottom:0;border-right:0;text-align:left;color:inherit}
.resumen .cifra:first-child{border-left:0;padding-left:0}
.resumen button.cifra:hover .v{color:var(--moca)}
.resumen .v{font:600 38px/1 "Cormorant Garamond",Georgia,serif;display:block;font-variant-numeric:lining-nums}
.resumen .v .de{font-size:20px;color:var(--sec);font-weight:500}
.resumen .l{display:block;font-size:13px;color:var(--sec);margin-top:6px;line-height:1.3}
@media (max-width:640px){
  .resumen{grid-template-columns:1fr 1fr}
  .resumen .cifra:nth-child(3){border-left:0;padding-left:0}
  .resumen .cifra:nth-child(n+3){border-top:1px solid var(--line)}
  .resumen .v{font-size:32px}
}

/* bloques */
.bloque{margin:0 0 22px}
.bloque h2{font:600 20px/1.2 "Cormorant Garamond",Georgia,serif;margin:0 0 8px;display:flex;align-items:baseline;gap:8px}
.bloque h2 .n{font:400 13px Jost,sans-serif;color:var(--sec)}
.aviso-vacio{color:var(--sec);font-size:14px;margin:4px 0 0}

/* lista corta (escribir hoy, próximos cobros) */
.corta{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.corta li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);min-height:44px}
.corta .quien{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left}
.corta .quien b{font-weight:500}
.corta .quien span{display:block;font-size:13px;color:var(--sec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.corta .cuando{font-size:13px;color:var(--sec);white-space:nowrap;text-align:right}
.corta .cuando.tarde{color:var(--rojo);font-weight:500}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:6px 11px;font-size:13.5px;white-space:nowrap}
.btn:hover{border-color:var(--arena)}
.btn.prim{background:var(--moca);color:var(--bg);border-color:var(--moca)}
.btn.peligro{color:var(--rojo)}

/* filtros */
.filtros{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 10px}
.chip{border:1px solid var(--line-2);background:transparent;border-radius:999px;padding:5px 11px;font-size:13px;color:var(--sec);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--cafe);color:var(--bg);border-color:var(--cafe)}
.chip .c{opacity:.7;font-size:12px}
.buscar{flex:1 1 160px;min-width:140px;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px}
.sep{width:1px;height:20px;background:var(--line-2);margin:0 4px}

/* filas */
.lista{border-top:1px solid var(--line)}
.fila{border-bottom:1px solid var(--line);scroll-margin-top:64px}
.fila.abierta{background:var(--surface);border-radius:0 0 12px 12px;box-shadow:0 1px 0 var(--line)}
.cab{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:4px 10px;align-items:center;width:100%;background:none;border:0;text-align:left;padding:12px 6px;min-height:56px}
.cab:hover{background:var(--sel)}
.fila.abierta .cab{background:var(--beige)}
.punto{width:10px;height:10px;border-radius:50%;background:var(--gris);display:inline-block;flex:none}
.punto.verde{background:var(--verde)} .punto.amarillo{background:var(--ambar)} .punto.rojo{background:var(--rojo)}
.punto.caliente{background:var(--rojo)} .punto.medio{background:var(--ambar)}
.nom{font-weight:500;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{grid-column:2 / 4;font-size:13px;color:var(--sec);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.der{font-size:13px;color:var(--sec);text-align:right;white-space:nowrap}
.der .tarde,.sub .tarde{color:var(--rojo);font-weight:500}
.der .pronto{color:var(--ambar);font-weight:500}
.etq{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--beige);color:var(--moca);white-space:nowrap}
.fila.abierta .etq{background:var(--surface)}
.etq.inactivo{background:transparent;border:1px solid var(--line-2);color:var(--sec)}
.cols{display:none}
@media (min-width:900px){
  .lista.cli .cab{grid-template-columns:14px minmax(150px,1.3fr) 110px 120px 150px 150px minmax(120px,1.4fr);gap:12px}
  .lista.lea .cab{grid-template-columns:14px minmax(150px,1.2fr) 170px 120px minmax(160px,1.5fr) 120px;gap:12px}
  .cab .sub{display:none}
  .cols{display:contents}
  .cols > span{font-size:13.5px;color:var(--cafe);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cols > span small{display:block;color:var(--sec);font-size:12px}
  .cab .der.movil{display:none}
  .encab{display:grid;padding:6px;gap:12px;font-size:12px;color:var(--sec)}
  .lista.cli .encab{grid-template-columns:14px minmax(150px,1.3fr) 110px 120px 150px 150px minmax(120px,1.4fr)}
  .lista.lea .encab{grid-template-columns:14px minmax(150px,1.2fr) 170px 120px minmax(160px,1.5fr) 120px}
}
.encab{display:none}
@media (min-width:900px){ .encab{display:grid} }

/* ficha */
.ficha{padding:14px 12px 16px;display:none}
.fila.abierta .ficha{display:block}
.grupo{margin:0 0 14px}
.grupo > h3{font:600 16px/1.2 "Cormorant Garamond",Georgia,serif;margin:0 0 8px;color:var(--moca)}
.campos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 12px}
.campo{display:flex;flex-direction:column;gap:3px;min-width:0}
.campo.ancho{grid-column:1 / -1}
.campo label{font-size:12.5px;color:var(--sec)}
.campo input,.campo select,.campo textarea{border:1px solid var(--line-2);background:var(--bg);border-radius:8px;padding:8px 10px;font-size:15px;width:100%;min-width:0;min-height:40px}
.campo textarea{resize:vertical;min-height:64px;line-height:1.45}
.campo input:focus,.campo select:focus,.campo textarea:focus{border-color:var(--arena);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--arena) 25%,transparent)}
.semaf{display:flex;gap:6px;flex-wrap:wrap}
.semaf button{border:1px solid var(--line-2);background:var(--bg);border-radius:999px;padding:6px 11px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.semaf button[aria-pressed="true"]{border-color:var(--cafe);background:var(--sel);font-weight:500}
.rapidos{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}
.rapidos span{font-size:13px;color:var(--sec);margin-right:2px}
.corta li:has(.escr){flex-wrap:wrap}
.escr{display:flex;flex-wrap:wrap;gap:5px;align-items:center;flex-basis:100%;margin:0 0 4px 20px}
.escr>span{font-size:12.5px;color:var(--sec)}
.escr .btn{padding:4px 10px;font-size:12.5px}
.pie{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.pie small{color:var(--sec);font-size:12px}
.cobros-cli{width:100%;border-collapse:collapse;font-size:13.5px}
.cobros-cli td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
.cobros-cli input{border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 6px;width:100%;min-width:0;font-size:13.5px}
.cobros-cli input:hover,.cobros-cli input:focus{border-color:var(--line-2);background:var(--bg)}
.cobros-cli td.f{width:132px} .cobros-cli td.i{width:84px} .cobros-cli td.e{width:104px;text-align:right}
.cobros-cli .pagado{color:var(--verde);font-weight:500}
.mas{margin-top:8px}
.archivados{margin:16px 0 40px;text-align:center}
.linkbtn{background:none;border:0;color:var(--sec);text-decoration:underline;text-underline-offset:3px;font-size:13.5px;padding:8px}
.fila.arch .nom{color:var(--sec);text-decoration:line-through;text-decoration-thickness:1px}

.pantalla{padding:60px 0;text-align:center;color:var(--sec)}
.pantalla h2{font:600 24px "Cormorant Garamond",Georgia,serif;color:var(--cafe);margin:0 0 6px}
.cargando{height:3px;background:linear-gradient(90deg,transparent,var(--arena),transparent);background-size:200% 100%;animation:barra 1.2s linear infinite;border-radius:3px;margin:30px auto;max-width:240px}
@keyframes barra{from{background-position:200% 0}to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.cargando{animation:none}}
[hidden]{display:none!important}

/* ───────── Ronda ───────── */
.rcab{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 16px;margin:0 0 14px}
.rcab h2{font:600 26px/1.1 "Cormorant Garamond",Georgia,serif;margin:0}
.rcab h2 small{display:block;font:400 13px Jost,sans-serif;color:var(--sec);margin-top:4px}
.rcab select{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px}
.avance{height:6px;border-radius:6px;background:var(--beige);overflow:hidden;margin:0 0 16px}
.avance i{display:block;height:100%;background:var(--verde);border-radius:6px;transition:width .4s}
.rres{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 0 16px}
.rres div{padding:12px 12px 10px;border-left:1px solid var(--line)}
.rres div:first-child{border-left:0;padding-left:0}
.rres b{font:600 30px/1 "Cormorant Garamond",Georgia,serif;display:block}
.rres span{font-size:12.5px;color:var(--sec)}
.rres .sube{color:var(--verde)} .rres .baja{color:var(--rojo)}
@media (max-width:640px){.rres{grid-template-columns:1fr 1fr}.rres div:nth-child(3){border-left:0;padding-left:0}.rres div:nth-child(n+3){border-top:1px solid var(--line)}}
.rlista{border-top:1px solid var(--line)}
.rfila{border-bottom:1px solid var(--line);scroll-margin-top:64px}
.rfila.abierta{background:var(--surface);border-radius:0 0 14px 14px}
.rfila.hecha .rnom{color:var(--sec)}
.rfila .rc{display:grid;grid-template-columns:14px minmax(0,1fr);gap:4px 10px;align-items:center;width:100%;background:none;border:0;text-align:left;padding:12px 6px;min-height:60px}
.rfila .rc:hover{background:var(--sel)}
.rfila.abierta .rc{background:var(--beige)}
.rnom{font-weight:500;font-size:15.5px;display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
.rnom .ok{color:var(--verde);font-size:14px}
.rchips{grid-column:2;justify-content:flex-start!important}
.rtit{grid-column:2;font-size:13.5px;color:var(--sec);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rchips{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.mini{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--beige);color:var(--moca);white-space:nowrap}
.rfila.abierta .mini{background:var(--surface)}
.mini.v{color:var(--verde)} .mini.a{color:var(--ambar)} .mini.r{color:var(--rojo)} .mini.n{background:transparent;border:1px solid var(--line-2);color:var(--sec)}
.rcuerpo{display:none;padding:6px 12px 18px}
.rfila.abierta .rcuerpo{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
@media (min-width:960px){.rfila.abierta .rcuerpo{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}.rcuerpo .ancho2{grid-column:1 / -1}}
.rsec h3{font:600 17px/1.2 "Cormorant Garamond",Georgia,serif;margin:0 0 8px;color:var(--moca);display:flex;align-items:baseline;gap:8px}
.rsec h3 small{font:400 12px Jost,sans-serif;color:var(--sec)}
.rsec p{margin:0 0 6px;font-size:14.5px;line-height:1.5;white-space:pre-line}
.rsec .lab{font-size:12px;color:var(--sec);text-transform:uppercase;letter-spacing:.08em;margin:8px 0 2px}
.dchips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 2px}
.dchip{border:1px solid var(--line-2);border-radius:10px;padding:5px 9px;font-size:13px;background:var(--bg)}
.dchip b{font-weight:500}
.dchip.v{border-color:color-mix(in srgb,var(--verde) 55%,var(--line-2))} .dchip.a{border-color:color-mix(in srgb,var(--ambar) 60%,var(--line-2))} .dchip.r{border-color:var(--rojo);color:var(--rojo)}
.prog{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.prog td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.prog td.k{white-space:nowrap;text-align:right;color:var(--sec)} .prog td.k b{color:var(--cafe)}
.prog td.d{width:26px;text-align:center;font-weight:600}
.prog .sube{color:var(--verde)} .prog .igual{color:var(--sec)} .prog .baja{color:var(--rojo)}
.prog small{display:block;color:var(--sec);font-size:12px}
.tec{margin:0;padding-left:18px;font-size:14px} .tec li{margin:2px 0}
.msg{width:100%;min-height:210px;border:1px solid var(--line-2);background:var(--bg);border-radius:12px;padding:12px;font-size:15px;line-height:1.5;resize:vertical}
.msg:focus{border-color:var(--arena);outline:none}
.racc{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
a.btn{text-decoration:none;color:inherit;display:inline-flex;align-items:center;gap:6px}
a.btn.prim{color:var(--bg)}
.btn.wa{background:#2E7D4F;border-color:#2E7D4F;color:#fff}
.estado-m{font-size:12.5px;color:var(--sec)} .estado-m.ok{color:var(--verde)} .estado-m.esp{color:var(--ambar)}
.pedir{display:flex;gap:6px;margin-top:8px}
.pedir input{flex:1;min-width:0;border:1px solid var(--line-2);background:var(--bg);border-radius:8px;padding:7px 10px;font-size:14px}
.versiones{margin-top:6px} .versiones summary{font-size:12.5px;color:var(--sec);cursor:pointer}
.versiones p{font-size:13px;color:var(--sec);border-left:2px solid var(--line-2);padding-left:8px;margin:6px 0}
.cambio{border:1px solid var(--line-2);border-radius:12px;padding:10px 12px;background:var(--bg);margin-bottom:8px}
.cambio.aplicado{border-color:color-mix(in srgb,var(--verde) 60%,var(--line-2))} .cambio.descartado{opacity:.6}
.cambio .ct{font-weight:500;font-size:14.5px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.cambio .cp{font-size:13.5px;color:var(--sec);margin:3px 0 0}
.cambio .cr{font-size:12.5px;color:var(--verde);margin-top:4px}
.nota-alex{width:100%;min-height:60px;border:1px solid var(--line-2);background:var(--bg);border-radius:10px;padding:8px 10px;font-size:14px;resize:vertical}
.rpie{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
@media (min-width:760px){.rfila .rc{grid-template-columns:14px minmax(0,1fr) auto}.rchips{grid-column:3;grid-row:1;justify-content:flex-end!important}.rtit{grid-column:2 / 4}}
.ejemplo{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:999px;border:1px dashed var(--arena);color:var(--moca)}
.rtipo{display:flex;gap:6px;margin:0 0 12px}
.rhead{display:flex;align-items:stretch}
.rhead .rc{flex:1;min-width:0}
.rcheck{flex:none;width:46px;display:flex;align-items:center;justify-content:center;background:none;border:0;padding:0 0 0 4px;cursor:pointer}
.cbox{width:24px;height:24px;border:1.5px solid var(--line-2);border-radius:7px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--bg)}
.rcheck:hover .cbox{border-color:var(--arena)}
.rcheck[aria-pressed="true"] .cbox{background:var(--verde);border-color:var(--verde)}
.rfila.hecha .rnom{text-decoration:line-through;text-decoration-color:var(--line-2)}
.rhechos{color:var(--cafe);font-weight:500}
.rtodo{margin:8px 0 4px;color:var(--verde);font-weight:500}
.vistazo h3{flex-wrap:wrap;row-gap:2px}

<body>
<div class="wrap">
  <header class="top">
    <div class="marca">
      <h1>Panel · Alex Aranda</h1>
      <small id="actualizado">Cargando…</small>
    </div>
    <div class="acc">
      <span id="sync" class="estado-sync" role="status" aria-live="polite"></span>
      <button class="ib" id="btnResp" title="Respuestas rápidas" aria-label="Respuestas rápidas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M5 4.5h14a2 2 0 0 1 2 2v8.5a2 2 0 0 1-2 2h-7l-4 3.2V17H5a2 2 0 0 1-2-2V6.5a2 2 0 0 1 2-2z"/><path d="M7.5 9.5h9M7.5 12.5h6"/></svg></button>
      <button class="ib" id="btnRecargar" title="Recargar datos" aria-label="Recargar datos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v4.5h-4.5"/></svg></button>
      <button class="ib" id="btnTema" title="Cambiar tema claro u oscuro" aria-label="Cambiar tema"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>

    <button role="tab" id="tabRonda" aria-selected="false" data-tab="ronda"><span class="ti" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M8.5 10h7M8.5 14h7M8.5 18h4"/></svg></span>Reportes<span class="n" id="nRon"></span></button>
    <button role="tab" id="tabLlam" aria-selected="false" data-tab="llamadas"><span class="ti" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h3l2 5-2.5 1.5a11 11 0 0 0 6 6L15 14l5 2v3a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg></span>Llamadas<span class="n" id="nLla"></span></button>

    <button class="nuevo" id="btnNuevo">+ Nuevo</button>

  <main id="app"><div class="cargando"></div></main>

<script>
(function(){
'use strict';
/* ───────── configuración ───────── */
var API = '/panel/api';
var KEY = new URLSearchParams(location.search).get('k') || '';
var DEBOUNCE_MS = 700;

var EST_CLI = ['Activo','Pausa','Inactivo','Por confirmar'];
var SEGUIM = ['Normal','Sin seguimiento proactivo','Sin seguimiento'];
var SEMAF = [['verde','Bien'],['amarillo','Ojo'],['rojo','En riesgo'],['','Por confirmar']];
var EST_LEAD = ['Nuevo','Hablando','Llamada agendada','Llamada hecha – no era el momento','Follow up','Cerrado','Perdido'];
var TEMP = [['caliente','Caliente'],['medio','Medio'],['por confirmar','Por confirmar']];
var ORIGEN = ['anuncio','Instagram','WhatsApp','referido','otro','por confirmar'];

/* ───────── estado ───────── */
var S = {
  tab: leerLocal('panel_tab') || 'hoy',
  data: null, abierta: null, verArch: false,
  fCli: 'Activo', fSem: '', qCli: '',
  fEstLead: 'abiertos', fTemp: '', qLead: ''
};
var pend = {};      // tabla|id -> {tabla,id,campos}
var timers = {};
var enVuelo = 0, conError = false;

function leerLocal(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function guardarLocal(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

/* ───────── utilidades ───────── */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function $(s,r){ return (r||document).querySelector(s); }
function $$(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
function pad(n){ return (n<10?'0':'')+n; }
function iso(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function hoy(){ return iso(new Date()); }
function sumar(isoF,n){ var p=isoF.split('-'); var d=new Date(+p[0],+p[1]-1,+p[2]); d.setDate(d.getDate()+n); return iso(d); }
function esFecha(s){ return /^\d{4}-\d{2}-\d{2}$/.test(String(s||'')); }
function dias(a,b){ var pa=a.split('-'),pb=b.split('-'); return Math.round((new Date(+pb[0],+pb[1]-1,+pb[2]) - new Date(+pa[0],+pa[1]-1,+pa[2]))/864e5); }
var MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function fCorta(s){ if(!esFecha(s)) return s||''; var p=s.split('-'); var t=+p[2]+' '+MESES[+p[1]-1]; if(p[0]!==hoy().slice(0,4)) t+=' '+p[0].slice(2); return t; }
function relativo(s){
  if(!esFecha(s)) return '';
  var n=dias(hoy(),s);
  if(n===0) return 'hoy'; if(n===1) return 'mañana'; if(n===-1) return 'ayer';
  if(n<0) return 'hace '+(-n)+' días'; if(n<=45) return 'en '+n+' días';
  var m=Math.round(n/30.4); return 'en '+m+' meses';
}
function num(v){ var n=parseFloat(String(v==null?'':v).replace(',','.')); return isNaN(n)?0:n; }
var EUR = new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:0});
var EUR2 = new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',minimumFractionDigits:0,maximumFractionDigits:2});
function euros(v){ var s=String(v==null?'':v).trim(); if(!s) return ''; if(isNaN(parseFloat(s.replace(',','.')))) return s; return EUR2.format(num(s)); }
function vivo(r){ return !r.archivado; }

/* ───────── red ───────── */
function api(accion, datos, keepalive){
  return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({k:KEY,accion:accion,datos:datos||{},panel:true}),keepalive:!!keepalive})
  .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
  .then(function(j){ if(!j||!j.ok) throw new Error((j&&j.error)||'Respuesta no válida'); return j.data; });
}

var syncT;
function pintarSync(){
  var el=$('#sync'); clearTimeout(syncT);
  if(conError){ el.className='estado-sync err'; el.innerHTML='Sin guardar · <button class="linkbtn" id="reintentar" style="padding:0;color:inherit">reintentar</button>'; var b=$('#reintentar'); if(b) b.onclick=function(){ conError=false; Object.keys(pend).forEach(enviar); }; return; }
  if(enVuelo>0 || Object.keys(pend).length){ el.className='estado-sync'; el.textContent='Guardando…'; return; }
  el.className='estado-sync ok'; el.textContent='Guardado ✓';
  syncT=setTimeout(function(){ el.textContent=''; },2200);
}

function programar(tabla,id,campos,inmediato){
  var k=tabla+'|'+id;
  if(!pend[k]) pend[k]={tabla:tabla,id:id,campos:{}};
  Object.assign(pend[k].campos,campos);
  clearTimeout(timers[k]);
  pintarSync();
  if(inmediato) enviar(k); else timers[k]=setTimeout(function(){ enviar(k); },DEBOUNCE_MS);
}
function enviar(k){
  var p=pend[k]; if(!p) return;
  delete pend[k]; clearTimeout(timers[k]); enVuelo++; pintarSync();
  api('guardar',{tabla:p.tabla,id:p.id,campos:p.campos}).then(function(fila){
    enVuelo--; var r=buscar(p.tabla,p.id); if(r&&fila&&fila.actualizado) r.actualizado=fila.actualizado; pintarSync();
  }).catch(function(e){
    enVuelo--; conError=true;
    if(!pend[k]) pend[k]={tabla:p.tabla,id:p.id,campos:{}};
    pend[k].campos=Object.assign({},p.campos,pend[k].campos);
    console.warn('No se pudo guardar',e); pintarSync();
  });
}
window.addEventListener('beforeunload',function(e){
  var ks=Object.keys(pend);
  ks.forEach(function(k){ var p=pend[k]; api('guardar',{tabla:p.tabla,id:p.id,campos:p.campos},true).catch(function(){}); });
  if(conError){ e.preventDefault(); e.returnValue=''; }
});
document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='hidden') Object.keys(pend).forEach(enviar); });

/* ───────── datos ───────── */
function tablaArr(t){ return t==='Clientes'?S.data.clientes:t==='Leads'?S.data.leads:t==='Planes'?LC.planes:t==='Tareas'?(S.data.tareas=S.data.tareas||[]):t==='Redes'?(S.data.redes=S.data.redes||[]):S.data.cobros; }
function buscar(t,id){ var a=tablaArr(t); for(var i=0;i<a.length;i++) if(a[i].id===id) return a[i]; return null; }
function cambiar(t,id,campo,valor,inmediato){
  var r=buscar(t,id); if(!r) return; r[campo]=valor;
  var c={}; c[campo]=valor; programar(t,id,c,inmediato);
}
function cobrosDe(cid){ return S.data.cobros.filter(function(p){ return vivo(p)&&p.cliente_id===cid; }).sort(function(a,b){ return (a.fecha||'').localeCompare(b.fecha||''); }); }
function proxCobro(cid){ var l=cobrosDe(cid).filter(function(p){ return p.estado!=='Cobrado'; }); return l[0]||null; }

function resumen(){
  var h=hoy(), mes=h.slice(0,7), en30=sumar(h,30), dow=new Date().getDay(), dom=sumar(h,dow===0?0:7-dow);
  var cli=S.data.clientes.filter(vivo), act=cli.filter(function(c){return c.estado==='Activo';});
  var cob=0, prev=0;
  S.data.cobros.filter(vivo).forEach(function(p){ if((p.fecha||'').slice(0,7)!==mes) return; prev+=num(p.importe); if(p.estado==='Cobrado') cob+=num(p.importe); });
  return {
    activos:act.length, cobrado:cob, previsto:prev,
    caducan:act.filter(function(c){ return esFecha(c.fin)&&c.fin>=h&&c.fin<=en30; }),
    retomar:cli.filter(function(c){ return c.estado!=='Activo'&&esFecha(c.retomar_fecha)&&c.retomar_fecha<=dom; }),
    conversar:act.filter(function(c){ return esFecha(c.proxima_conversacion)&&c.proxima_conversacion<=dom; }),
    leadsHoy:leadsAbiertos().filter(function(l){ return esFecha(l.proximo_contacto)&&l.proximo_contacto<=h; })
  };
}
function leadsAbiertos(){ return S.data.leads.filter(function(l){ return vivo(l)&&l.estado!=='Cerrado'&&l.estado!=='Perdido'; }); }

/* ───────── avisos de la app ───────── */
var AV={cargado:false,cargando:false,err:'',lista:[],errores:[]};
var AV_TIPO={no_entra:'No entra',semana:'Semana a medias',molestia:'Molestia',abierto:'Entreno a medias',nota:'Nota',peso:'Peso'};
function avisosCargar(fresco){
  AV.cargando=true; AV.err='';

/* Recordatorio de cobro por WhatsApp, escrito en la voz de Alex (sin ¿ ¡). Alex lo revisa antes de enviarlo */
/* Último cobro y siguiente de un cliente, en una línea, con el botón que toque */
/* En el resumen de la ficha, el cobro solo si urge (Alex 30/10: lo de pagos, en su botón) */
function cobroUrgente(cid){
  var sig=(S.data.cobros||[]).filter(function(p){ return vivo(p)&&p.cliente_id===cid&&p.estado!=='Cobrado'&&esFecha(p.fecha); }).sort(function(a,b){ return a.fecha.localeCompare(b.fecha); })[0];
  return sig&&sig.fecha<=sumar(hoy(),7)?cobroResumen(cid):'';
}
function cobroResumen(cid){
  var cs=(S.data.cobros||[]).filter(function(p){ return vivo(p)&&p.cliente_id===cid; }).sort(function(a,b){ return (a.fecha||'').localeCompare(b.fecha||''); });
  if(!cs.length) return '';
  var hechos=cs.filter(function(p){ return p.estado==='Cobrado'; }), pend=cs.filter(function(p){ return p.estado!=='Cobrado'; });
  var ult=hechos[hechos.length-1], sig=pend[0], h=hoy(), n=sig?cs.indexOf(sig)+1:0;
  var t=(ult?'<b>Último cobro:</b> '+esc(fCorta(ult.fecha))+(ult.importe?' · '+esc(euros(ult.importe)):'')+(ult.metodo?' · '+esc(ult.metodo):'')+' · ✓':'<b>Ningún cobro marcado todavía</b>')+
    (sig?' &nbsp;·&nbsp; <b>Siguiente:</b> <span class="'+(sig.fecha<h?'tarde':'')+'">'+esc(fCorta(sig.fecha))+(sig.fecha<h?' (atrasado)':'')+'</span>'+(sig.importe?' · '+esc(euros(sig.importe)):'')+(cs.length>1?' · cuota '+n+' de '+cs.length:'')+(sig.ultimo==='Sí'?' · la última':''):' &nbsp;·&nbsp; <b>Todo pagado</b>: no quedan cobros');
  return '<div class="cobrolin"><span class="ic" aria-hidden="true">💳</span><span class="tx">'+t+'</span>'+(sig?'<span class="racc">'+btnCobro(sig)+'<button class="btn" data-cobrar="'+esc(sig.id)+'">Cobrado</button></span>':'')+'</div>';
}
function esStripe(p){ var c=(S.data.clientes||[]).filter(function(x){ return x.id===p.cliente_id; })[0]||{}; return /stripe/i.test(String(p.metodo||'')+' '+String(c.metodo||'')); }
function btnCobro(p){ return esStripe(p)?'<a class="btn" href="https://dashboard.stripe.com/payments" target="_blank" rel="noopener" title="Es automático: comprueba que ha entrado y márcalo cobrado">Ver en Stripe</a>':'<a class="btn wa" href="'+esc(waCobro(p))+'" target="_blank" rel="noopener" title="Abre WhatsApp con el recordatorio escrito">Recordar</a>'; }
function waCobro(p){
  var c=(S.data.clientes||[]).filter(function(x){ return x.id===p.cliente_id; })[0]||{};
  var nom=String(c.nombre||p.cliente||'').split(' ')[0], h=hoy(), imp=euros(p.importe);
  var MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  var fl=esFecha(p.fecha)?(+p.fecha.slice(8,10))+' de '+MES[+p.fecha.slice(5,7)-1]:'';
  var t=p.fecha<h?('Hola '+nom+'!\n\nTe escribo por la cuota del programa del '+fl+(imp?' ('+imp+')':'')+', que no me consta todavía. Si ya la has hecho, dímelo y lo apunto, vale?\n\nUn abrazo!')
    :('Hola '+nom+'!\n\nTe recuerdo que '+(p.fecha===h?'hoy':'el '+fl)+' toca la cuota del programa'+(imp?' ('+imp+')':'')+'. Cuando la tengas hecha me dices, vale?\n\nUn abrazo!');
  var tel=avTel(c); return 'https://wa.me/'+(tel||'')+'?text='+encodeURIComponent(t);
}
function avTel(a){ var d=String(a.telefono||'').replace(/[^0-9]/g,'').replace(/^00/,''); return /^[6789]\d{8}$/.test(d)?'34'+d:d; }
function avisosHtml(){

      '<span class="avacc"><a class="btn wa" href="https://wa.me/'+(tel||'')+'" target="_blank" rel="noopener">WhatsApp</a><button class="btn" data-avvisto="'+esc(a.id)+'">Visto</button></span></li>'; }).join('')+'</ul>';

function cabCliente(c){

  var cobCls=pc&&pc.fecha<h?'tarde':'';

  return '<span class="punto '+esc(c.semaforo)+'" title="'+esc(semTxt(c.semaforo))+'"></span>'+
    '<span class="nom">'+esc(c.nombre||'Sin nombre')+(c.estado!=='Activo'?' <span class="etq inactivo">'+esc(c.estado)+'</span>':'')+'</span>'+
    '<span class="der movil">'+(fin?'<span class="'+finCls+'">'+esc(relativo(fin))+'</span>':'')+'</span>'+
    '<span class="sub">'+(notaUtil(c)?esc(c.semaforo_nota):esc(sub))+'</span>'+
    '<span class="cols"><span>'+esc(c.programa)+'<small>'+esc(c.forma_pago)+'</small></span>'+
    '<span class="'+finCls+'">'+esc(finTxt)+'<small>'+esc(fin?relativo(fin):'')+'</small></span>'+
    '<span class="'+cobCls+'">'+esc(cobTxt)+'<small>'+esc(pc?(pc.metodo||c.metodo||''):'')+'</small></span>'+
    '<span>'+esc(conv)+'<small>'+esc(c.conversacion_motivo||(c.estado!=='Activo'?c.retomar_motivo:''))+'</small></span>'+
    '<span style="color:var(--sec)">'+esc(notaUtil(c)?c.semaforo_nota:semTxt(c.semaforo))+'</span></span>';

 ['/pesarse','Pesarse los miércoles','Te cuento cómo pesarnos a partir de ahora ⚖️\n\nUna vez por semana, los miércoles, en ayunas: al levantarte, después de ir al baño y antes de comer o beber nada. Siempre con la misma báscula y con poca ropa.\n\nLo apuntas en la app, en Mi progreso, o en el formulario. Si esa semana te va a venir la regla o la tienes, márcalo, que el peso sube un poco por líquido.\n\nEl peso de un día suelto puede variar hasta un kilo y pico por agua, comida o la regla, así que lo que miramos es la tendencia de varias semanas, junto con las fotos y las medidas.'],
 ['/cambiardia','Cambiar el día de entreno','Sin problema! Pásalo al día que te vaya mejor y haz el que te tocaba, aunque en la app ponga otra cosa. No hace falta recuperar nada ni hacer dos el mismo día.\n\nY si la semana se complica de verdad, con el entreno corto ya cuenta como hecho 💪'],
 ['/sintiempo','Semana sin tiempo','Semanas así llegan, es normal 😊\n\nCuando vas sin tiempo o sin energía (la semana antes de la regla, por ejemplo), el entreno corto de 10-15 minutos cuenta como hecho. Ahora lo que importa es no cortar el hábito, aunque sea con el mínimo.'],
 ['/comerfuera','Comer fuera','Para cuando comas fuera, tres cositas y listo 🍽️\n\nPrimero elige la proteína (carne, pescado, huevo o legumbre), súmale verdura o ensalada y el hidrato que te apetezca, más o menos un puño.\n\nSi la salsa es cremosa, pídela aparte. El pan o el postre, el que más te apetezca, o los dos si es una ocasión especial.\n\nY al día siguiente comes normal, sin compensar nada.'],
 ['/viaje','De viaje','Para el viaje, que no se pare el hábito ✈️\n\nSi hay gimnasio cerca (o en el hotel), seguimos con tu rutina aunque cambien los días. Si no, entreno corto en la habitación y caminar mucho, que de viaje sale solo.\n\nLo mejor es entrenar por la mañana, antes de que empiece el día y se líe. Y avísame cuando llegues, vale?']
];

function avisosRenov(cid){
  var out=[]; if(!cid||!S.data||!S.data.clientes) return out;

  if(esFecha(c.fin)){ var d=Math.round((new Date(c.fin)-new Date(h))/864e5);
    if(d<0) out.push({n:'r',t:'Programa acabado el '+fCorta(c.fin)+': hablar de renovar'});
    else if(d<=45) out.push({n:d<=14?'r':'a',t:'Le quedan '+d+(d===1?' día':' días')+' de programa (acaba el '+fCorta(c.fin)+'): toca hablar de renovar'}); }
  var pend=(S.data.cobros||[]).filter(function(p){ return vivo(p)&&p.cliente_id===cid&&p.estado!=='Cobrado'; }).sort(function(a,b){ return (a.fecha||'').localeCompare(b.fecha||''); });
  var ult=pend.filter(function(p){ return p.ultimo==='Sí'; })[0];
  if(ult&&esFecha(ult.fecha)){ var d2=Math.round((new Date(ult.fecha)-new Date(h))/864e5); if(d2<=30) out.push({n:'a',t:'Último cobro '+(d2<0?'atrasado ('+fCorta(ult.fecha)+')':'el '+fCorta(ult.fecha))}); }

  pend.filter(function(p){ return esFecha(p.fecha)&&p.fecha>=sumar(h,-10)&&p.fecha<=sumar(h,3); }).forEach(function(p){ var st=esStripe(p), tarde=p.fecha<h;
    out.push({n:tarde?'r':'a',cobro:true,t:(st?'Cobro por Stripe '+(tarde?'del ':'el ')+fCorta(p.fecha)+(p.importe?' ('+euros(p.importe)+')':'')+': comprueba que ha entrado y márcalo cobrado':(tarde?'Cobro sin marcar del ':'Toca cobrar el ')+fCorta(p.fecha)+(p.importe?' ('+euros(p.importe)+')':'')+(p.metodo?' por '+p.metodo:'')+': recuérdaselo'),btn:btnCobro(p)}); });
  return out;
}

function barras(vals,etqs,fmt,max){

function linea(vals,etqs,fmt){

function crCierreAuto(){ var v=CR.txt.vida.slice(0,3).map(function(x){ return x.charAt(0).toLowerCase()+x.slice(1); }); return v.length?'Con '+(v.length>1?v.slice(0,-1).join(', ')+' y '+v[v.length-1]:v[0])+'.':''; }

var crT=null; function crVistaLuego(){ clearTimeout(crT); crGuardarLocal(); crT=setTimeout(crVista,500); }
function crEventos(o){
  var box=o.querySelector('.crbox');
  box.querySelectorAll('details.crsec').forEach(function(d){ d.addEventListener('toggle',function(){ if(d.open&&d.dataset.crsec!=='vista') CR.abierto=d.dataset.crsec; }); });
  box.oninput=function(e){ var el=e.target;
    if(el.dataset.crt){ CR.txt[el.dataset.crt]=el.value; crVistaLuego(); } };
  box.onchange=function(e){ var el=e.target; if(el.dataset.crf){ CR[el.dataset.crf]=el.value; crAutoSlots(); crGuardarLocal(); crPintar(o); } };
  box.onkeydown=function(e){ var el=e.target; if(e.key!=='Enter'||!el.dataset.crotro) return; e.preventDefault(); var v=el.value.trim(); if(!v) return;
    if(el.dataset.crotro==='vida'){ CR.txt.vida.push(v); crGuardarVida(); } else if(el.dataset.crotro==='logro'){ if(CR.txt.conseguido.length<4) CR.txt.conseguido.push(v); } else if(el.dataset.crotro==='chat'){ crChatAdd(box); return; }
    crGuardarLocal(); crPintar(o); };
  box.onclick=function(e){ var b=e.target.closest('button'); if(!b) return;
    if(b.hasAttribute('data-crx')){ o.hidden=true; return; }
    var tog=function(arr,v,max){ var i=arr.indexOf(v); if(i>=0) arr.splice(i,1); else if(!max||arr.length<max) arr.push(v); };
    if(b.hasAttribute('data-crvida')){ tog(CR.txt.vida,b.getAttribute('data-crvida')); crGuardarVida(); }
    else if(b.hasAttribute('data-crlog')){ tog(CR.txt.conseguido,b.getAttribute('data-crlog'),4); }
    else if(b.hasAttribute('data-crplan')){ tog(CR.txt.plan,b.getAttribute('data-crplan'),4); }
    else if(b.hasAttribute('data-cralt')){ var c=b.getAttribute('data-cralt'), v=b.getAttribute('data-v'); if(c==='chat'){ var mh=v.match(/ ⟨([^⟩]*)⟩$/); if(CR.txt.chat.length<3) CR.txt.chat.push({t:mh?v.slice(0,mh.index):v,h:mh?mh[1]:''}); } else CR.txt[c]=v; }
    else if(b.hasAttribute('data-crpal')){ CR.pal=b.getAttribute('data-crpal'); crEscribir('pal',CR.pal); }
    else if(b.hasAttribute('data-crvoz')){ var x=CR.cmp.textos[+b.getAttribute('data-crvoz')]; CR.txt.vAntes=x.antes||''; CR.txt.vAhora=x.ahora; }
    else if(b.hasAttribute('data-crchatx')){ CR.txt.chat.splice(+b.getAttribute('data-crchatx'),1); }
    else if(b.hasAttribute('data-crchatadd')){ crChatAdd(box); return; }
    else if(b.hasAttribute('data-crslot')){ var p=b.getAttribute('data-crslot').split('|'); crElegir(p[0],p[1]); return; }
    else if(b.hasAttribute('data-crdesc')){ crDescargar(b.getAttribute('data-crdesc'),b); return; }
    else return;
    crGuardarLocal(); crPintar(o); };
}

    var res={antes:{},ahora:{}}, prom=[];

    return Promise.all(prom).then(function(){ var t=CR.txt, tiempo=crTiempo()||'12 semanas';
      return {antes:res.antes,ahora:res.ahora,tiempo:tiempo,frase:t.frase,frase2:t.frase2,etiquetas:['Al empezar',tiempo],vida:t.vida,plan:t.plan,

      var files=bl.map(function(b,i){ return new File([b],base+'-'+(i+1)+'.jpg',{type:'image/jpeg'}); });

$('#btnTema').onclick=function(){
  var r=document.documentElement, oscuro=r.getAttribute('data-theme')?r.getAttribute('data-theme')==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  r.setAttribute('data-theme',oscuro?'light':'dark'); guardarLocal('panel_tema',oscuro?'light':'dark');
};
(function(){ var t=leerLocal('panel_tema'); if(t==='dark'||t==='light') document.documentElement.setAttribute('data-theme',t); })();
$('#btnNuevo').onclick=function(){
  if(!S.data) return;
  var b=this, esCli=S.tab==='clientes', tabla=esCli?'Clientes':'Leads';
  var campos=esCli?{nombre:'',estado:'Activo',seguimiento:'Normal',semaforo:'',inicio:hoy()}
                  :{nombre:'',temperatura:'medio',estado:'Nuevo',origen:'por confirmar',ultima_fecha:hoy(),proximo_contacto:sumar(hoy(),1)};
  b.disabled=true; var txt=b.textContent; b.textContent='Creando…';
  if(S.abierta){ Object.keys(pend).forEach(enviar); S.abierta=null; var y0=window.scrollY; pintar(); window.scrollTo(0,y0); }
  api('nuevo',{tabla:tabla,campos:campos}).then(function(f){
    tablaArr(tabla).push(f); S.verArch=false;
    if(esCli){ S.fCli='Activo'; S.fSem=''; S.qCli=''; } else { S.fEstLead='abiertos'; S.fTemp=''; S.qLead=''; }
    S.abierta=null; abrir(tabla+'|'+f.id,true);
    var n=$('.fila.abierta [data-campo="nombre"]'); if(n) n.focus();
    b.disabled=false; b.textContent=txt; flash();
  }).catch(function(err){ b.disabled=false; b.textContent=txt; alerta(err); });
};
